services:
  minio:
    image: ghcr.io/imagegenius/minio:latest
    container_name: quant_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: quant_clickhouse
    ports:
      - "8123:8123"
      - "9009:9009"
    environment:
      CLICKHOUSE_DB: quant_platform
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  minio_data:
  clickhouse_data:

